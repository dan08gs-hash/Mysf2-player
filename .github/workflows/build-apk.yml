name: Compilar SF2 Player

on:
  workflow_dispatch:
  push:
    paths:
      - 'SF2Player_v0.9.5_ESTAVEL_AUDIO_PERSISTENTE.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Gerar APK Android
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Configurar Android SDK
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "$ANDROID_HOME/cmdline-tools" ]; then
            echo "::error::Pasta de ferramentas Android não encontrada."
            exit 1
          fi

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager não encontrado."
            exit 1
          fi

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" --install \
            'platform-tools' \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;27.2.12479018' \
            'cmake;3.22.1'

      - name: Extrair projeto
        id: projeto
        shell: bash
        run: |
          set -euo pipefail

          ZIP="SF2Player_v0.9.5_ESTAVEL_AUDIO_PERSISTENTE.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::ZIP não encontrado: $ZIP"
            exit 1
          fi

          mkdir -p extraido
          unzip -oq "$ZIP" -d extraido

          ROOT="$(find "$GITHUB_WORKSPACE/extraido" -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"

          if [ -z "$ROOT" ] || [ ! -f "$ROOT/app/build.gradle.kts" ]; then
            echo "::error::Estrutura do projeto Android
